seed: 1234
seeds_for_final_runs:
- 13
- 42
- 87
- 1234
- 2027
data:
  data_dir: /content/SenseShift/data
  language: SV
  run_integrity_check: true
split:
  strategy: nested_lowo_rotating_validation
  file: /content/SenseShift/data/splits/SV_splits.json
  validation_offset: 1
  folds: all
preprocessing:
  spelling_normalisation: true
  lowercase: false
  context_window: null
  max_usages_per_period: null
model:
  frozen_encoder: xlm-roberta-base
  base_encoder: xlm-roberta-base
  layer: 8
  pooling: target_mean
  max_length: 256
  embedding_batch_size: 32
training:
  enabled: true
  objective: contrastive
  learning_rate: 1.0e-05
  batch_size: 16
  epochs: 5
  warmup_ratio: 0.1
  weight_decay: 0.01
  dropout: 0.1
  max_grad_norm: 1.0
  optimizer: adamw
  scheduler: linear
  early_stopping_patience: 2
  selection_metric: val_bcubed_f1
  selection_mode: max
  exclude_conflicting_duplicates: true
  deterministic: true
clustering:
  method: agglomerative
  linkage: average
  distance: cosine
  threshold_percentiles:
  - 5
  - 10
  - 15
  - 20
  - 30
  - 40
  - 50
  - 60
  - 70
  - 80
  - 90
  min_cluster_sizes:
  - 5
  - 10
  - 15
  - 20
  - 30
  kmeans_k_range:
  - 2
  - 10
  selection_objective: combined
baselines:
  random_seed: 42
  run:
  - majority
  - random
  - classical
  - pretrained_frozen
evaluation:
  min_instances_1b: 10
  shuffle_control_draws: 200
  report_within_era_rho: true
  bootstrap_resamples: 10000
  bootstrap_seed: 42
  ci_level: 0.95
output:
  results_dir: /content/SenseShift/results/runs
  checkpoints_dir: /content/SenseShift/checkpoints
